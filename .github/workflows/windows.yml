name: Windows build and verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: Build media engines and corresponding source
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Compile pinned Windows x64 engines and codec sources
        run: node --use-system-ca scripts/prepare-media.mjs
      - name: Verify corresponding source and resource integrity
        run: node scripts/verify-media.mjs
      - name: Transfer media resources to Windows verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Media-engines-and-source
          path: |
            resources/bin/
            resources/ffmpeg/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: media
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit locked dependencies
        run: bun run audit
      - name: Download compiled engines and corresponding source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Media-engines-and-source
          path: resources
      - name: Prepare pinned media engines
        run: bun run media:prepare
      - name: Reject incomplete or modified media distributions
        run: bun run test:media
      - name: Verify production build
        run: bun run build
      - name: Verify native media conversions
        run: bun run test
      - name: Verify Electron UI
        run: bun run test:ui
      - name: Build Windows x64 installer
        run: bun run dist
      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:SWITCHOID_EXECUTABLE = Join-Path $PWD 'release\win-unpacked\Switchoid.exe'
          bun run test:ui
      - name: Verify installer, installed application, and uninstallation
        run: bun run test:installer
      - name: Upload installer, corresponding source, notices, and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Switchoid-Windows-x64
          path: |
            release/Switchoid-Setup-*.exe
            release/Switchoid-Media-Source-*.tar.gz
            release/Switchoid-Media-Provenance-*.json
            release/Switchoid-Third-Party-Notices-*.md
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload screenshots and UI results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Electron-verification
          path: artifacts/
          if-no-files-found: ignore
